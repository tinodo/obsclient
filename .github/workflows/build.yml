# Builds and tests OBSClient on every push/PR to main.
# The library and its tests are cross-platform; the WinForms sample is Windows-only and is built separately.
name: Build and Test

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  # No path filter on pull requests: main requires these checks, and a workflow that is skipped by a path filter
  # leaves its required checks pending forever, which would block every docs-only pull request. No branch filter
  # either, so that a pull request that is stacked on another one gets the same checks.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the tooling compiles
        if: matrix.os == 'ubuntu-latest'
        run: python3 -m py_compile tools/verify-package.py tools/protocol/protocol_model.py tools/protocol/generate.py tools/protocol/update.py

      # The protocol-derived code under OBSClient/Generated and the snapshot of the tests are generated from
      # tools/protocol/obs-websocket-protocol.json and tools/protocol/overlay.toml. They must be what the generator
      # produces: change the inputs, run `python tools/protocol/generate.py` and commit the result.
      - name: Check the generated code is up to date
        if: matrix.os == 'ubuntu-latest'
        run: python3 tools/protocol/generate.py --check

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore OBSClient.Tests/OBSClient.Tests.csproj

      - name: Build
        run: dotnet build OBSClient.Tests/OBSClient.Tests.csproj --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test OBSClient.Tests/OBSClient.Tests.csproj
          --no-build --configuration Release
          --logger "trx;LogFilePrefix=test-results"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/**/*.trx
          retention-days: 14

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: TestResults/**/coverage.cobertura.xml
          retention-days: 14

  package:
    name: Pack (single assembly)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore OBSClient/OBSClient.csproj

      - name: Build
        run: dotnet build OBSClient/OBSClient.csproj --configuration Release --no-restore

      - name: Pack
        run: dotnet pack OBSClient/OBSClient.csproj --configuration Release --no-build --output ./artifacts

      # The package has to stay one thing: the library, its XML documentation, the README and the license. The protocol
      # definition and the code generator are inputs of the build, they are never shipped (not even embedded).
      - name: Verify the package is a single assembly
        run: python3 tools/verify-package.py ./artifacts/*.nupkg

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package-preview
          path: ./artifacts/*.nupkg
          retention-days: 14

  build-sample:
    name: Build WinForms Sample
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SampleWindowsAppliation/SampleWindowsAppliation.csproj

      - name: Build
        run: dotnet build SampleWindowsAppliation/SampleWindowsAppliation.csproj --no-restore --configuration Release
