# Decisions that obs-websocket's protocol.json does not make for the client.
#
# tools/protocol/generate.py reads protocol.json (what the protocol says) and this file (what the client makes of it)
# and writes the protocol-derived code under OBSClient/Generated. Both are inputs of the build and are never shipped:
# the package stays a single assembly (tools/verify-package.py checks that in CI).
#
# What is not listed here follows the conventions in protocol_model.py, so a request, event or field that a new
# obs-websocket version introduces needs an entry only when the convention is not what you want.

[protocol]
# The obs-websocket version that obs-websocket-protocol.json was taken from (tools/protocol/update.py keeps it current).
version = "5.7.6"

# ---------------------------------------------------------------------------------------------------------------
# Patches: where upstream's protocol.json does not match what obs-websocket really does (checked in its source).
# They are applied before anything is generated and to the snapshot that the conformance tests use.
# ---------------------------------------------------------------------------------------------------------------

# ToggleRecordPause returns outputPaused (RequestHandler_Record.cpp), but its documentation comment lacks the field.
[patches.response.ToggleRecordPause]
add = [{ name = "outputPaused", type = "Boolean", description = "Whether the output is paused" }]

# Deprecated copies of sceneName/sceneUuid. The response types expose sceneName and sceneUuid only.
[patches.response.GetCurrentProgramScene]
omit = ["currentProgramSceneName", "currentProgramSceneUuid"]

[patches.response.GetCurrentPreviewScene]
omit = ["currentPreviewSceneName", "currentPreviewSceneUuid"]

